[project]
name = "splitwise"
version = "0.1.0"
description = "Splitter AI Django REST API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Django>=5.2,<6.0",
    "django-cors-headers>=4.9,<5.0",
    "djangorestframework>=3.16,<4.0",
    "dj-database-url>=3.1,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "python-dotenv>=1.2,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
]

[dependency-groups]
dev = ["ruff>=0.14,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
